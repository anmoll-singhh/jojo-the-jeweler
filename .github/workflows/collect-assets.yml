# Pull client assets (existing Shopify store + Google Drive folder) into the repo.
# Runs by hand from the Actions tab, or when content/COLLECT changes. Results are committed
# back to the same branch so the site builds from git alone.
name: Collect client assets

on:
  push:
    paths:
      - content/COLLECT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg + gdown
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: Collect
        env:
          STORE_DOMAIN: jojoxwaves.myshopify.com
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'waves' }}
          DRIVE_FOLDER: https://drive.google.com/drive/folders/1chCfcTjSx9Mq0aJ6K_qu8koo70kmi_M0
        run: node scripts/collect-assets.mjs
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "jojo-assets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content public/media
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Assets: collect Shopify catalogue and Drive media"
          git pull --rebase --autostash
          git push
